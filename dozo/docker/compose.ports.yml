# Why this exists: upstream hard-codes the published ports (web 5173, api 3100); only the web
# bind ADDRESS is configurable (RAKAZO_WEB_BIND). A busy 5173 therefore cannot be avoided by
# configuration alone. This override moves the web port to DOZO_WEB_PORT and does not publish
# the api (the web proxy reaches it on the compose network). It also makes the stack's own network
# dual-stack (below). Nothing else is changed.
services:
  web:
    ports: !override
      - "${RAKAZO_WEB_BIND:-127.0.0.1}:${DOZO_WEB_PORT:-5173}:5173"
  api:
    ports: !reset []

# A computer's network is dual-stack while its egress is open (as on a host without the egress
# rules), and the web joins it to reach the computer's screen. On a web with no IPv6 network of its
# own, Docker then moves the web's IPv6 gateway to the computer's network and maps its published
# port again, so the port refuses connections for a moment at every computer start and stop. With
# a dual-stack network of its own the gateway stays (Docker 28.4 and 29). The live stack publishes
# no port (dozo/deploy/compose.deploy.yml) and is not affected.
networks:
  default:
    enable_ipv6: true
