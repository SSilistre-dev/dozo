# Static server for dozo/landing, mounted read-only at /etc/nginx/conf.d. Behind the panel's proxy,
# which ends TLS. add_header is declared once at server level: a location that declares its own
# add_header drops all of these, so locations use `expires` (which sets Cache-Control) instead.
# The language a visitor chose is remembered without a script: every page under /tr/ sets the
# cookie to tr, an address with ?lang=en (the English link on the Turkish pages) sets it to en, and
# the home address alone sends a visitor whose cookie says tr to /tr/. Only these two exact values
# are ever written or acted on, and the one redirect target is fixed. Copy the tr lines for a new
# language. The privacy pages name this cookie: change them with it.
map "$uri $arg_lang" $dozo_lang_cookie {
  default "";
  "~^/tr/" "dozo_lang=tr; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax";
  "~ en$" "dozo_lang=en; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax";
}
map "$cookie_dozo_lang $arg_lang" $dozo_lang_home {
  default "";
  "tr " "/tr/";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # /tr redirects to /tr/ with a relative Location: the proxy in front owns the scheme, host and port.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Pre-launch: remove with robots.txt and the page's noindex meta (dozo/landing/README.md).
  add_header X-Robots-Tag "noindex" always;
  # Empty for most requests, and nginx sends no header for an empty value.
  add_header Set-Cookie $dozo_lang_cookie always;
  # The home address answers by cookie, so a browser must not reuse the other answer.
  add_header Vary "Cookie" always;
  # The page has no inline script or style element. style-src-attr allows the style attributes in
  # the markup; scripts may still set styles through the DOM.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  error_page 404 /404.html;
  location = /404.html { internal; expires 5m; }
  # One pair per language directory, so a missing page under it answers in that language.
  location = /tr/404.html { internal; expires 5m; }
  location /tr/ {
    error_page 404 /tr/404.html;
    try_files $uri $uri/ =404;
    expires 5m;
  }

  location = / {
    if ($dozo_lang_home) { return 302 $dozo_lang_home; }
    try_files /index.html =404;
    expires 5m;
  }
  location / {
    try_files $uri $uri/ =404;
    expires 5m;
  }
  # The published pages name these with a content version (site-assets.sh), so a deploy shows at
  # once whatever a cache in front keeps. The hour is for a request without one.
  location ~* \.(css|js)$ { expires 1h; }
  location ~* \.(png|svg|ico)$ { expires 30d; }
}
