name: Bug report
description: Something in Dozo does not work as it should
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a bot and send "hello"
        2. Open the computer pane
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hosted
        - Self-hosted
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Self-hosted only.
      placeholder: abc1234

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and tokens first.
