[package]
name = "dozo-desktop"
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-window-state = "2.5"
tauri-plugin-updater = "2.14"
# The language of the one update line (update.rs).
sys-locale = "0.3"
# tauri.conf.json's plugin settings are built into the app as JSON.
serde_json = "1"
# "Let Bots Use This Computer" (device.rs, device_socket.rs, device_run.rs): the system prompt, the
# pairing request, the server connection and the commands. reqwest, rustls, tokio and sha2 are
# the versions the app already builds; tokio-tungstenite is the WebSocket client.
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# Stops a command's whole process group (device_run.rs).
libc = "0.2"

# The device token in the system's keyring (device_pairing.rs): Keychain, Credential Manager,
# Secret Service (over D-Bus in Rust, no system library).
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3.6"
features = ["apple-native"]
[target.'cfg(windows)'.dependencies.keyring]
version = "3.6"
features = ["windows-native"]
[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3.6"
features = ["async-secret-service", "tokio", "crypto-rust"]

# For src/frames.rs only. The same crates and versions the webview layer already builds.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSURL",
  "NSURLRequest",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKFrameInfo",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKWebView",
] }

# For src/frames_gtk.rs only. The version the webview layer already builds.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[dev-dependencies]
# Unit tests of the update check (update.rs) run against a mock app.
tauri = { version = "2.12", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
