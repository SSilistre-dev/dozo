name: dozo-gate

# Dozo fork gate. A pull request into main (including the upstream sync PR) must pass the fast
# local checks, the brand leak path (stage the tree, apply the codemod, fail on any user-visible
# "Rakazo" string), upstream's repository checks on the branded tree, the fork's unit tests with
# their coverage floor and the web startup budget on the branded web build. Needs only Docker, which
# stock GitHub runners have. It runs olc, stage, brand, checks, unit and budget (on the Dockerfile's
# build stage alone), never the full image build, up, smoke or the
# browser e2e suite (only its inventory project runs; the whole suite is dozo-e2e-nightly; see dozo/README.md, Status and known limits). A required status check matches the job
# name below: when it changes, update the branch protection rule too.
# Third-party actions are pinned to a full commit SHA with the version in a comment (the same
# SHAs the upstream workflows use).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dozo-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: olc, brand leak gate and fork unit tests
    runs-on: ubuntu-latest
    # issues: write only keeps the Turkish queue issue below; it is used for same-repository sync pull requests.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # Nothing after this step pushes, and `make olc` and the unit run read the tree only:
          # the token is not left in .git/config. The one step that asks origin passes it in.
          persist-credentials: false

      # dozo/docker/gate.sh compares against the pristine upstream-main branch, and a check that
      # cannot run fails. ls-remote --exit-code answers 2 for "no such ref" and 128 for a network or
      # auth error: only the first means the branch is absent, and neither one is a pass.
      - name: Fetch upstream-main
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0
          git ls-remote --exit-code --heads "$remote" upstream-main >/dev/null || rc=$?
          case "$rc" in
            0) git fetch "$remote" +refs/heads/upstream-main:refs/heads/upstream-main ;;
            2)
              echo "::error::origin has no upstream-main branch, so the upstream-edit check cannot run. Create it once from the upstream remote: git fetch upstream main, then publish upstream/main to origin as refs/heads/upstream-main"
              exit 2
              ;;
            *)
              echo "::error::could not ask origin for upstream-main (git ls-remote exit $rc): a network or permission problem, not an absent branch"
              exit 2
              ;;
          esac

      # On a runner without the Node image, olc pulls it and fails if it cannot (CI is set), so a
      # PASS always means node --check and the brand tests ran.
      - name: make olc
        run: make olc

      # Not DOZO_STAGE_WORKTREE: the PR checkout is committed content, stage exports HEAD.
      - name: Stage tree
        run: dozo/docker/build.sh stage

      - name: Apply brand and run leak gate
        run: dozo/docker/build.sh brand

      # Upstream's `pnpm checks` on the branded tree, in a throwaway git repository inside the
      # container (git is installed there), so the fork's dozo-* files meet upstream's conventions.
      - name: Repository checks on the branded tree
        shell: bash
        run: dozo/docker/gate.sh checks 2>&1 | tee "$RUNNER_TEMP/checks.log"

      # Upstream adds interface text almost every day and the Turkish check lets it through as
      # pending. On the sync pull request the pending ids go into one issue, so they wait in a
      # visible queue; the fork's own untranslated text still fails the step above.
      - name: Update the queue of upstream strings waiting for Turkish
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'upstream-sync') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$RUNNER_TEMP/checks.log" ] || exit 0
          grep -q '^TURKISH: ' "$RUNNER_TEMP/checks.log" || exit 0
          pending=$(grep -c '^pending: ' "$RUNNER_TEMP/checks.log" || true)
          {
            echo "Strings upstream added that the Turkish catalog still shows in English, as of pull request #$PR."
            echo "Translate them in a brand rule on the Turkish catalog (dozo/brand/brand.json), or list a term Turkish keeps in English in dozo/brand/catalog-turkish-same.json. This issue is rewritten by every sync pull request."
            echo
            echo '~~~~'
            grep '^pending: ' "$RUNNER_TEMP/checks.log" | sed 's/^pending: //' || true
            echo '~~~~'
          } > "$RUNNER_TEMP/queue.md"
          n=$(gh issue list --label turkish-queue --state all --json number --jq '.[0].number // empty')
          if [ "$pending" -gt 0 ]; then
            if [ -n "$n" ]; then
              gh issue edit "$n" --body-file "$RUNNER_TEMP/queue.md"
              gh issue reopen "$n" || true
            else
              gh label create turkish-queue --color fbca04 --description "Upstream strings waiting for a Turkish translation" --force >/dev/null
              gh issue create --title "Translate the interface text upstream added into Turkish" --label turkish-queue --body-file "$RUNNER_TEMP/queue.md"
            fi
          elif [ -n "$n" ]; then
            gh issue edit "$n" --body "Nothing is waiting: every upstream string has a Turkish translation, as of pull request #$PR."
            gh issue close "$n" || true
          fi

      # Every route, settings section and overlay of the branded web app is crawled or skipped with a
      # reason (dozo/e2e/surfaces.ts). It reads the staged tree only, no stack and no browser, so a
      # moved or renamed upstream file is caught here and not by the nightly e2e run.
      - name: e2e inventory
        run: dozo/e2e/inventory.sh

      # The fork's own tests and the per-file coverage floor. A runner starts with no dependency
      # volume, so this is the cold run (about 80 s: pnpm install and the coverage provider, inside
      # the container only, nothing on the runner). Network and Docker are all it needs; the Node
      # image is already there from make olc.
      - name: Fork unit tests and coverage floor
        run: dozo/docker/gate.sh unit

      # The web startup budget (scripts/checks/bundle-size.mjs) on the branded web build: the
      # Dockerfile's build stage only (the same web build `make qa` measures in the dozo-web image,
      # without the runtime image or the other services), then the step `make qa` runs after build.
      # Red (exit 2) over the limit; the log always has the `web-startup:` line.
      - name: Branded web build and startup budget
        run: |
          docker build --target build -t dozo-budget-web -f infra/compose/Dockerfile dozo/.stage/src
          DOZO_BUDGET_IMAGE=dozo-budget-web dozo/docker/gate.sh budget
