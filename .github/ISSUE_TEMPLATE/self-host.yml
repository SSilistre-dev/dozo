name: Self-host problem
description: Dozo does not build, start or stay up on your own machine
labels:
  - self-host
body:
  - type: dropdown
    id: step
    attributes:
      label: Which step fails?
      options:
        - Build (make up)
        - Start or database migration
        - First sign-in
        - Bot computer
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      placeholder: make up
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Do not paste `.env` contents or keys.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit
      placeholder: abc1234
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Operating system and Docker version
      placeholder: Ubuntu 24.04, Docker 27
    validations:
      required: true
