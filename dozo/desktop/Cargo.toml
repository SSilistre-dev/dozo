[package]
name = "dozo-desktop"
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-window-state = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# The language of the one update line (update.rs).
sys-locale = "0.3"
# tauri.conf.json's plugin settings are built into the app as JSON.
serde_json = "1"

# For src/frames.rs only. The same crates and versions the webview layer already builds.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  "NSURL",
  "NSURLRequest",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKFrameInfo",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKWebView",
] }

# For src/frames_gtk.rs only. The version the webview layer already builds.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[dev-dependencies]
# Unit tests of the update check (update.rs) run against a mock app.
tauri = { version = "2.12", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
