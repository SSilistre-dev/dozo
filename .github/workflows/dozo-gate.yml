name: dozo-gate

# Dozo fork gate. A pull request into main (including the upstream sync PR) must pass the fast
# local checks, the brand leak path (stage the tree, apply the codemod, fail on any user-visible
# "Rakazo" string) and the fork's unit tests with their coverage floor. Needs only Docker, which
# stock GitHub runners have. It runs olc, stage, brand and unit only, never build, up, smoke or the
# e2e suite (see dozo/README.md, Status and known limits). A required status check matches the job
# name below: when it changes, update the branch protection rule too.
# Third-party actions are pinned to a full commit SHA with the version in a comment (the same
# SHAs the upstream workflows use).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dozo-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: olc, brand leak gate and fork unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # Nothing after this step pushes, and `make olc` and the unit run read the tree only:
          # the token is not left in .git/config. The one step that asks origin passes it in.
          persist-credentials: false

      # dozo/docker/gate.sh compares against the pristine upstream-main branch, and a check that
      # cannot run fails. ls-remote --exit-code answers 2 for "no such ref" and 128 for a network or
      # auth error: only the first means the branch is absent, and neither one is a pass.
      - name: Fetch upstream-main
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0
          git ls-remote --exit-code --heads "$remote" upstream-main >/dev/null || rc=$?
          case "$rc" in
            0) git fetch "$remote" +refs/heads/upstream-main:refs/heads/upstream-main ;;
            2)
              echo "::error::origin has no upstream-main branch, so the upstream-edit check cannot run. Create it once from the upstream remote: git fetch upstream main, then publish upstream/main to origin as refs/heads/upstream-main"
              exit 2
              ;;
            *)
              echo "::error::could not ask origin for upstream-main (git ls-remote exit $rc): a network or permission problem, not an absent branch"
              exit 2
              ;;
          esac

      # On a runner without the Node image, olc pulls it and fails if it cannot (CI is set), so a
      # PASS always means node --check and the brand tests ran.
      - name: make olc
        run: make olc

      # Not DOZO_STAGE_WORKTREE: the PR checkout is committed content, stage exports HEAD.
      - name: Stage tree
        run: dozo/docker/build.sh stage

      - name: Apply brand and run leak gate
        run: dozo/docker/build.sh brand

      # The fork's own tests and the per-file coverage floor. A runner starts with no dependency
      # volume, so this is the cold run (about 80 s: pnpm install and the coverage provider, inside
      # the container only, nothing on the runner). Network and Docker are all it needs; the Node
      # image is already there from make olc.
      - name: Fork unit tests and coverage floor
        run: dozo/docker/gate.sh unit
